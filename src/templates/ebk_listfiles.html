<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<a href="{{ url_for('ebook') }}">
    <button type="button">&lt; Back</button>
</a>
{% block header %}
<div>
    <h3 style="margin-bottom: 0">{% block title %}Existing files:{% endblock %}</h3>
</div>
<table class="options">
    <td class="options">
        <input type="checkbox" id="select_all" name="select_all" onchange="select_deselect(this)">
        <label for="select_all">Select all</label>
    </td>
    <td class="options">
        <input type="checkbox" id="revert" name="revert" onchange="revert_selected()">
        <label for="revert">Revert</label>
    </td>
    <td class="options">
        <button>Convert Selected</button>
    </td>
    <td class="options">
        <button>Email Selected</button>
    </td>
    <td class="options">
        <button>Delete Selected</button>
    </td>
    <td class="options">
        <label for="sort_by">Sort by</label>
        <select name="sort_by" id="sort_by" onchange="sort_by_selected(this.value)">
            <optgroup label="------------">
            <option value="name_0">Filename a &rarr; z</option>
            <option value="name_1">Filename z &rarr; a</option>
            <option value="folder_0">Folder a &rarr; z</option>
            <option value="folder_1">Folder z &rarr; a</option>
            <option value="date_0">Date: Old &rarr; New</option>
            <option value="date_1">Date: New &rarr; Old</option>
        </select>
    </td>
    <td class="options">
        <label for="filter_by">Filter by</label>
        <select name="filter_by" id="filter_by">
            <option value="tags">Tags</option>
            <option value="author">Author</option>
            <option value="rating">Rating</option>
        </select>
    </td>
</table>
{% endblock %}
<div id="main"></div>
<div id="contextMenu" class="context-menu" style="display:none">
    <ul>
        <li id="preview">Preview</li>
        <li id="rename">Rename</li>
        <li id="edit">Edit</li>
        <li id="email">Email</li>
        <li id="delete" style="border-bottom: 1px solid darkgray">Delete</li>
        <li id="txt" value=1>Convert txt -> </li>
        <li id="epub" value=1>Convert ePub -> </li>
        <li id="pdf" value=1>Convert PDF -> </li>
        <li id="mobi" value=1>Convert Mobi -> </li>
        <li id="azw3" value=1>Convert azw3 -> </li>
    </ul>
</div>
<div id="subMenu" class="context-menu" style="display:none">
    <ul>
        <li id="to_txt"> txt </li>
        <li id="to_epub"> ePub </li>
        <li id="to_pdf"> PDF </li>
        <li id="to_mobi"> Mobi </li>
        <li id="to_azw3"> azw3 </li>
    </ul>
</div>
<div id="preview_div" class="preview-div" style="display:none;position: absolute">
    <textarea style="background-color: lightgray; width: 100%; height:100%" id="preview_content"
              onclick="quit_preview()" placeholder="章节预览："></textarea>
</div>
<script>
    $("#main").load("/ebk_listfiles_main");

    const actions = {
        "preview": (event, id) => preview(event, id),
        "rename": (event, id) => rename(id),
        "edit": (event, id) => edit(id),
        "email": (event, id) => email(id),
        "delete": (event, id) => delete_file(id)
    };

    function toggle_collapse_folder(input) {
        let id = input.parentElement.dataset.label;
        console.log("/ebk_listfiles_main #" + id)
        $("[id='" + id + "']").load("/ebk_listfiles_main", {'path': id})
        input.classList.toggle('expanded');
        let content = document.getElementById(id)
        if (content.style.display === "block") {
            content.style.display = "none";
        } else {
            content.style.display = "block";
        }
    }

    function hideItemMenu() {
        document.getElementById("contextMenu").style.display = "none"
        document.getElementById("subMenu").style.display = "none"
    }

    function onSubMenu(x, y, id, from) {
        console.log(id + ', ' + from)
        let menu = document.getElementById("subMenu")
        menu.style.display = 'block';
        menu.style.left = (x + 150) + "px";
        menu.style.top = y + "px";
        // console.log("menu.style.left " + menu.style.left)
        // console.log("menu.style.top " + menu.style.top)

        const nestedLists = menu.querySelectorAll('li');
        nestedLists.forEach(li => {
            disable_context_option(li.id, ("to_" + from) === li.id);
            li.addEventListener('click', (menuEvent) => {
                ebk_to_format(id, from, li.id.substring(3))
                hideItemMenu();
            });
        });
    }

    function onItemMenu(event, parent) {
        let id = parent + event.target.innerText
        console.log("open menu on: " + id);
        event.preventDefault();
        let menu = document.getElementById("contextMenu")
        if (menu.style.display === "block")
            hideItemMenu();
        else {
            menu.style.display = 'block';
            menu.style.left = event.pageX + "px";
            menu.style.top = event.pageY + "px";
            // const contextMenu = document.querySelector('#contextMenu');
            const nestedLists = menu.querySelectorAll('li');
            nestedLists.forEach(li => {
                if (li.value === 1) {
                    disable_context_option(li.id, get_ext_path(id, '.' + li.id) === '')
                }
                li.addEventListener('click', (menuEvent) => {
                    console.log('A LI in the context menu was clicked!', menuEvent.currentTarget.value);
                    let menu_id = menuEvent.currentTarget.id
                    if (menuEvent.currentTarget.value === 1) {
                        onSubMenu(event.pageX, menuEvent.pageY, id, menu_id)
                    } else {
                        actions[menu_id](event, id);
                        hideItemMenu();
                    }
                });
            });
        }
    }

    function get_ext_path(file_name, ext) {
        let href = document.getElementById(file_name + ext).href;
        if (href) {
            console.log(file_name + ext)
            return file_name + ext;
        }
        return ''
    }

    function disable_context_option(id, disabled) {
        let target = document.getElementById(id)
        if (disabled) {
            target.style.opacity = "0.5"
            target.style.pointerEvents = "none";
        } else {
            target.style.opacity = "1"
            target.style.pointerEvents = "auto";
        }
    }

    function preview(event, id) {
        let file_path = get_ext_path(id + ".txt");
        if (file_path === "") {
            console.log("preview " + file_path + ": txt format not available");
            return;
        }
        console.log("preview " + file_path);
        $.post("/ebk_preview", {'file_path': file_path}, function (response) {
            if (response.code === 200) {
                let view = document.getElementById('preview_div');
                view.style.display = "block";
                let rect = event.target.getBoundingClientRect();
                view.style.left = rect.left + "px";
                view.style.top = rect.bottom + window.scrollY + "px";
                let content_view = document.getElementById("preview_content");
                content_view.value = response.data;
            } else {
                alert(response.message);
            }
        })
    }

    function quit_preview() {
        let view = document.getElementById("preview_div");
        view.style.display = "none";
    }

    function ebk_to_format(id, from, to) {
        console.log("convert " + id + ': from ' + from + " to " + to);
        $.post("/ebk_to_format", {'file_path': id, 'from': from, 'to': to}, function (response) {
            if (response.output && response.output.length > 0) {
                let item = document.getElementById(id + '.' + to);
                item.href = "ebk_download?file_path=" + response.output;
                item.style.color = "#377ba8";
            } else {
                alert(response.message);
            }
        });
    }

    function edit(id) {
        console.log("edit " + id);
    }

    function rename(id) {
        console.log("rename " + id);
    }

    function email(id) {
        const epub_path = get_ext_path(id + ".epub");
        if (epub_path === "") {
            window.alert("Email " + id + ": epub format is not available");
            return;
        }
        console.log("request sending email with attachment: " + id);
        $.post("/ebk_email", {'paths[]': [epub_path]}, function (response) {
            window.alert(response.message);
        });
    }

    function delete_file(id) {
        console.log("delete " + id);
    }

    function revert_selected() {
        let all = document.getElementsByName("file_checkbox");
        for (let i = 0; i < all.length; i++) {
            all[i].checked = !all[i].checked;
        }
    }

    function select_deselect(target) {
        let select = false;
        if (target.checked)
            select = true;
        let all = document.getElementsByName("file_checkbox");
        for (let i = 0; i < all.length; i++) {
            all[i].checked = select;
        }
    }

    function sort_by_selected(value) {
        let option = value.split('_')
        $("#main").load("ebk_listfiles #main", {'sort_by': option[0], 'reverse': option[1]})
    }
</script>
